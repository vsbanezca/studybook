<main class="contenedor-pantalla">
  <h1 class="sb-titulo-pantalla">Crear espacio</h1>
  <p class="texto-apoyo sb-apoyo">Registra un espacio de estudio para que los miembros puedan reservarlo.</p>

  @if (mostrarMensajeExito()) {
    <sb-message tipo="exito" [texto]="textoExito" (aceptado)="aceptarMensajeExito()" />
  } @else {
    <form [formGroup]="form" (ngSubmit)="solicitarConfirmacion()" novalidate>
      <div class="grupo-campo sb-campo">
        <label for="nombre" class="etiqueta-campo sb-etiqueta">Nombre del espacio</label>
        <input type="text" id="nombre" formControlName="nombre" class="sb-input" [sbCampo]="form.controls.nombre">
        <sb-field-error idMensaje="nombre-error" [control]="form.controls.nombre" />
      </div>

      <div class="grupo-campo sb-campo">
        <label for="ubicacion" class="etiqueta-campo sb-etiqueta">Ubicación (edificio)</label>
        <input type="text" id="ubicacion" formControlName="ubicacion" class="sb-input" [sbCampo]="form.controls.ubicacion">
        <sb-field-error idMensaje="ubicacion-error" [control]="form.controls.ubicacion" />
      </div>

      <div class="grupo-campo sb-campo">
        <label for="piso" class="etiqueta-campo sb-etiqueta">Piso</label>
        <input type="text" id="piso" formControlName="piso" class="sb-input" [sbCampo]="form.controls.piso">
        <sb-field-error idMensaje="piso-error" [control]="form.controls.piso" />
      </div>

      <div class="grupo-campo sb-campo">
        <label for="descripcion" class="etiqueta-campo sb-etiqueta">Descripción (opcional)</label>
        <textarea id="descripcion" formControlName="descripcion" rows="3" class="sb-input"></textarea>
      </div>

      <div class="grupo-campo sb-campo">
        <label for="capacidad" class="etiqueta-campo sb-etiqueta">Capacidad (personas)</label>
        <input type="number" id="capacidad" formControlName="capacidad" min="1" step="1" class="sb-input"
          [sbCampo]="form.controls.capacidad" sbAyuda="capacidad-ayuda">
        <sb-field-error idMensaje="capacidad-error" [control]="form.controls.capacidad" [mensajes]="mensajes['capacidad']" />
        <small class="sb-apoyo" id="capacidad-ayuda">Número entero mayor que 0.</small>
      </div>

      <div class="acciones-formulario">
        <a class="sb-btn sb-btn-secundario" routerLink="/espacios">Cancelar</a>
        <button type="submit" class="sb-btn sb-btn-primario" [disabled]="enviando()" [attr.aria-busy]="enviando() ? 'true' : null">
          Crear espacio
        </button>
      </div>
    </form>
  }

  <sb-confirm-dialog
    [abierto]="mostrarModalConfirmacion()"
    [titulo]="textoConfirmar"
    [datos]="datosConfirmacion"
    (confirmado)="confirmarCreacion()"
    (rechazado)="cancelarConfirmacion()" />
</main>
