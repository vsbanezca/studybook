<main class="contenedor-pantalla">
  <h1 class="sb-titulo-pantalla">Espacios</h1>

  @if (cargado()) {
    @if (espacios().length > 0) {
      <p class="texto-apoyo sb-apoyo">
        {{ esAdministrador ? 'Elige un espacio para ver su equipamiento.' : 'Elige un espacio para reservarlo o ver su equipamiento.' }}
      </p>

      <div class="grid-espacios">
        @for (espacio of espacios(); track espacio.id) {
          <!-- «Reservar» solo se ofrece al Miembro. -->
          <sb-space-card
            [espacio]="espacio"
            [modo]="esAdministrador ? 'ver' : 'reservar'"
            (verEquipamiento)="verEquipamiento($event)"
            (reservar)="reservar($event)" />
        }
      </div>
    } @else {
      <sb-empty-state
        icono="building-2"
        titulo="No hay espacios registrados"
        [texto]="esAdministrador
          ? 'Crea el primer espacio para que los miembros puedan reservarlo.'
          : 'Cuando el administrador agregue espacios, podrás reservarlos aquí.'" />
    }
  }

  @if (esAdministrador) {
    <div class="acciones-fijas">
      <a class="sb-btn sb-btn-primario" routerLink="/espacios/nuevo">Crear espacio</a>
    </div>
  }
</main>
