<main class="pantalla">
  <aside class="panel sb-textura">
    <sb-wordmark [size]="44" variante="claro" />
  </aside>

  <section class="formulario">
    @if (registrado()) {
      <div class="contenido">
        <h1 class="sb-titulo-pantalla">Registrarse</h1>
        <sb-message tipo="exito" [texto]="textoExito" (aceptado)="aceptarExito()" />
      </div>
    } @else {
      <form class="contenido" [formGroup]="form" (ngSubmit)="solicitarConfirmacion()" novalidate>
        <h1 class="sb-titulo-pantalla">Registrarse</h1>

        <div class="sb-campo">
          <label class="sb-etiqueta" for="nombre">Nombre</label>
          <input id="nombre" class="sb-input" type="text" autocomplete="name" formControlName="nombre" [sbCampo]="form.controls.nombre" />
          <sb-field-error idMensaje="nombre-error" [control]="form.controls.nombre" [mensajes]="mensajes.nombre" />
        </div>

        <div class="sb-campo">
          <label class="sb-etiqueta" for="cedula">Cédula</label>
          <input id="cedula" class="sb-input" type="text" inputmode="numeric" autocomplete="off" formControlName="cedula" [sbCampo]="form.controls.cedula" />
          <sb-field-error idMensaje="cedula-error" [control]="form.controls.cedula" [mensajes]="mensajes.cedula" />
        </div>

        <div class="sb-campo">
          <label class="sb-etiqueta" for="correo">Correo institucional</label>
          <input id="correo" class="sb-input" type="email" autocomplete="username" formControlName="correo" [sbCampo]="form.controls.correo" />
          <sb-field-error idMensaje="correo-error" [control]="form.controls.correo" [mensajes]="mensajes.correo" />
        </div>

        <div class="sb-campo">
          <label class="sb-etiqueta" for="telefono">Teléfono</label>
          <input id="telefono" class="sb-input" type="tel" autocomplete="tel" formControlName="telefono" [sbCampo]="form.controls.telefono" />
          <sb-field-error idMensaje="telefono-error" [control]="form.controls.telefono" [mensajes]="mensajes.telefono" />
        </div>

        <div class="sb-campo">
          <label class="sb-etiqueta" for="clave">Contraseña</label>
          <input id="clave" class="sb-input" type="password" autocomplete="new-password" formControlName="clave" [sbCampo]="form.controls.clave" sbAyuda="clave-ayuda" />
          <sb-field-error idMensaje="clave-error" [control]="form.controls.clave" [mensajes]="mensajes.clave" />
          <small class="requisito sb-apoyo" id="clave-ayuda" [class.cumplido]="claveCumpleMinimo()">
            <sb-icon [nombre]="claveCumpleMinimo() ? 'circle-check' : 'info'" />
            Mínimo {{ minimoClave }} caracteres{{ claveCumpleMinimo() ? ': cumplido' : '' }}
          </small>
        </div>

        <button type="submit" class="sb-btn sb-btn-primario sb-btn-bloque" [disabled]="enviando()"
          [attr.aria-busy]="enviando() ? 'true' : null">
          Registrarse
        </button>
        <a class="sb-enlace" routerLink="/iniciar-sesion">Iniciar sesión</a>
      </form>
    }
  </section>

  <sb-confirm-dialog
    [abierto]="confirmando()"
    [titulo]="textoConfirmar"
    [datos]="datosConfirmacion"
    (confirmado)="confirmarRegistro()"
    (rechazado)="rechazarConfirmacion()" />
</main>
