<main class="pantalla">
  <aside class="panel sb-textura">
    <sb-wordmark [size]="44" variante="claro" />
  </aside>

  <section class="formulario">
    <form class="contenido" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
      <h1 class="sb-titulo-pantalla">Iniciar sesión</h1>

      <div class="sb-campo">
        <label class="sb-etiqueta" for="correo">Correo</label>
        <input
          #correoEl
          id="correo"
          class="sb-input"
          type="email"
          formControlName="correo"
          autocomplete="username"
          [sbCampo]="form.controls.correo"
        />
        <sb-field-error idMensaje="correo-error" [control]="form.controls.correo" [mensajes]="mensajes['correo']" />
      </div>

      <div class="sb-campo">
        <label class="sb-etiqueta" for="clave">Contraseña</label>
        <input
          #claveEl
          id="clave"
          class="sb-input"
          type="password"
          formControlName="clave"
          autocomplete="current-password"
          [sbCampo]="form.controls.clave"
        />
        <sb-field-error idMensaje="clave-error" [control]="form.controls.clave" [mensajes]="mensajes['clave']" />
      </div>

      <button
        type="submit"
        class="sb-btn sb-btn-primario sb-btn-bloque"
        [disabled]="enviando()"
        [attr.aria-busy]="enviando() ? 'true' : null"
      >
        Iniciar sesión
      </button>
      <a class="sb-enlace" routerLink="/registrarse">Registrarse</a>
    </form>
  </section>
</main>
