<main class="contenedor-pantalla">
  <h1 class="sb-titulo-pantalla">Agregar equipamiento</h1>
  @if (espacio(); as e) {
    <p class="texto-apoyo sb-apoyo">Espacio: {{ e.nombre }}, {{ e.ubicacion }}, piso {{ e.piso }}</p>
  }

  @if (creado()) {
    <sb-message tipo="exito" [texto]="textoExito" (aceptado)="aceptarExito()" />
  } @else {
    <form [formGroup]="form" (ngSubmit)="solicitarConfirmacion()" novalidate>
      <div class="grupo-campo sb-campo">
        <label for="nombre" class="sb-etiqueta">Nombre</label>
        <input type="text" id="nombre" formControlName="nombre" class="sb-input" [sbCampo]="form.controls.nombre">
        <sb-field-error idMensaje="nombre-error" [control]="form.controls.nombre" />
      </div>

      <div class="grupo-campo sb-campo">
        <label for="categoria" class="sb-etiqueta">Categoría</label>
        <input type="text" id="categoria" formControlName="categoria" class="sb-input" [sbCampo]="form.controls.categoria">
        <sb-field-error idMensaje="categoria-error" [control]="form.controls.categoria" />
      </div>

      <div class="grupo-campo sb-campo">
        <label for="estado" class="sb-etiqueta">Estado</label>
        <input type="text" id="estado" formControlName="estado" class="sb-input" [sbCampo]="form.controls.estado">
        <sb-field-error idMensaje="estado-error" [control]="form.controls.estado" />
      </div>

      <div class="grupo-campo sb-campo">
        <label for="cantidad" class="sb-etiqueta">Cantidad</label>
        <input type="number" id="cantidad" formControlName="cantidad" min="1" step="1" class="sb-input" [sbCampo]="form.controls.cantidad">
        <sb-field-error idMensaje="cantidad-error" [control]="form.controls.cantidad" [mensajes]="mensajes['cantidad']" />
      </div>

      <div class="grupo-campo sb-campo">
        <label for="descripcion" class="sb-etiqueta">Descripción</label>
        <textarea id="descripcion" formControlName="descripcion" rows="3" class="sb-input" [sbCampo]="form.controls.descripcion"></textarea>
        <sb-field-error idMensaje="descripcion-error" [control]="form.controls.descripcion" />
      </div>

      <div class="acciones-formulario">
        <a class="sb-btn sb-btn-secundario" [routerLink]="['/espacios', espacioId, 'equipamiento']">Cancelar</a>
        <button type="submit" class="sb-btn sb-btn-primario" [disabled]="enviando()" [attr.aria-busy]="enviando() ? 'true' : null">
          Agregar equipamiento
        </button>
      </div>
    </form>
  }

  <sb-confirm-dialog
    [abierto]="confirmando()"
    [titulo]="textoConfirmar"
    [datos]="datosConfirmacion"
    (confirmado)="confirmarCreacion()"
    (rechazado)="rechazarConfirmacion()" />
</main>
