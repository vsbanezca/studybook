<main class="contenedor-pantalla">
  <h1 class="sb-titulo-pantalla">Crear reserva</h1>
  <p class="texto-apoyo sb-apoyo">Elige un espacio e indica la fecha, el horario y la cantidad de asistentes.</p>

  @if (creada()) {
    <sb-message tipo="exito" [texto]="textoExito" (aceptado)="aceptarExito()" />
  } @else if (cargado() && espacios().length > 0) {
    <section aria-labelledby="titulo-espacios">
      <h2 class="sb-titulo-seccion" id="titulo-espacios">Espacio</h2>
      <div class="grid-espacios" role="radiogroup" aria-labelledby="titulo-espacios">
        @for (espacio of espacios(); track espacio.id) {
          <sb-space-card
            [espacio]="espacio"
            modo="selectable"
            [seleccionado]="seleccionado()?.id === espacio.id"
            (seleccionar)="elegir($event)" />
        }
      </div>
      <sb-field-error idMensaje="espacioId-error" [control]="form.controls.espacioId" [mensajes]="mensajes.espacioId" />
    </section>

    <form [formGroup]="form" (ngSubmit)="reservar()" novalidate>
      <h2 class="sb-titulo-seccion">Datos de la reserva</h2>

      <div class="grupo-campo sb-campo">
        <label for="fecha" class="sb-etiqueta">Fecha</label>
        <input type="date" id="fecha" formControlName="fecha" [min]="minimoFecha" class="sb-input" [sbCampo]="form.controls.fecha">
        <sb-field-error idMensaje="fecha-error" [control]="form.controls.fecha" [mensajes]="mensajes.fecha" />
      </div>

      <div class="fila-horas">
        <div class="grupo-campo sb-campo">
          <label for="horaInicio" class="sb-etiqueta">Hora de inicio</label>
          <input type="time" id="horaInicio" formControlName="horaInicio" class="sb-input" [sbCampo]="form.controls.horaInicio">
          <sb-field-error idMensaje="horaInicio-error" [control]="form.controls.horaInicio" [mensajes]="mensajes.horaInicio" />
        </div>
        <div class="grupo-campo sb-campo">
          <label for="horaFin" class="sb-etiqueta">Hora de fin</label>
          <input type="time" id="horaFin" formControlName="horaFin" class="sb-input" [sbCampo]="form.controls.horaFin">
          <sb-field-error idMensaje="horaFin-error" [control]="form.controls.horaFin" [mensajes]="mensajes.horaFin" />
        </div>
      </div>

      <div class="grupo-campo sb-campo">
        <label for="asistentes" class="sb-etiqueta">Cantidad de asistentes</label>
        <input type="number" id="asistentes" formControlName="asistentes" min="1" step="1" class="sb-input" [sbCampo]="form.controls.asistentes">
        <sb-field-error idMensaje="asistentes-error" [control]="form.controls.asistentes" [mensajes]="mensajes.asistentes" />
      </div>

      <div class="acciones-formulario">
        <a class="sb-btn sb-btn-secundario" routerLink="/mis-reservas">Cancelar</a>
        <button type="submit" class="sb-btn sb-btn-primario" [disabled]="enviando()" [attr.aria-busy]="enviando() ? 'true' : null">
          Reservar
        </button>
      </div>
    </form>
  }

  <sb-confirm-dialog
    [abierto]="confirmando()"
    [titulo]="textoConfirmar"
    [datos]="datosConfirmacion"
    (confirmado)="confirmarReserva()"
    (rechazado)="rechazarConfirmacion()" />
</main>
