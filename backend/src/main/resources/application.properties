spring.application.name=studybook

# Persistencia provisional en archivos JSON (carpeta ignorada por git)
studybook.datos.dir=./data

# Cuenta de Administrador precargada: definir por variables de entorno
studybook.admin.correo=${STUDYBOOK_ADMIN_CORREO:}
studybook.admin.clave=${STUDYBOOK_ADMIN_CLAVE:}
studybook.admin.nombre=${STUDYBOOK_ADMIN_NOMBRE:Administrador}
studybook.admin.cedula=${STUDYBOOK_ADMIN_CEDULA:}

# Dominios de correo institucional permitidos al registrarse, separados por coma.
# SUPOSICION: valor inicial a confirmar con el equipo y la profesora.
studybook.registro.dominios=${STUDYBOOK_DOMINIOS:ucab.edu.ve,est.ucab.edu.ve}

# Zona horaria para las reglas de fecha y hora (por ejemplo, la hora de inicio de una reserva de hoy).
# SUPOSICION: valor inicial America/Caracas.
studybook.zona-horaria=${STUDYBOOK_ZONA_HORARIA:America/Caracas}

# Cookie de sesion: no accesible desde JavaScript y no se envia en peticiones de otros sitios
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=60m

# Un numero con decimales no se acepta donde se espera un entero (p. ej. capacidad)
spring.jackson.deserialization.accept-float-as-int=false
